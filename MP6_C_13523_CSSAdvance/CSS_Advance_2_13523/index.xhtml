<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Formulir Pendaftaran Kompetisi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="wrapper">
        <div id="content">
            <h1>Formulir Registrasi Kompetisi Karya</h1>
            
            <form action="" method="post" enctype="multipart/form-data">
                <fieldset>
                    <h2>Identitas Regu</h2>
                    <table>
                        <tr class="hlRow">
                            <td style="width:32%;">
                                <label for="nama"><strong>Nama Regu</strong></label>
                            </td>
                            <td>
                                <input type="text" id="nama" name="nama" size="30" />
                            </td>
                        </tr>
                        <tr class="regrow">
                            <td style="width:32%;">
                                <label for="ketua"><strong>Nama Ketua Regu</strong></label>
                            </td>
                            <td>
                                <input type="text" id="ketua" name="ketua" size="30" />
                            </td>
                        </tr>
                        <tr class="hlRow">
                            <td>
                                <label for="jumlah"><strong>Jumlah Anggota Regu</strong></label>
                            </td>
                            <td>
                                <input type="text" id="jumlah" name="jumlah" size="30" />
                            </td>
                        </tr>
                        <tr class="regrow">
                            <td>
                                <label for="prodi"><strong>Program Studi</strong></label>
                            </td>
                            <td>
                                <select id="prodi" name="prodi">
                                    <option>Informatika</option>
                                    <option>Sistem Informasi</option>
                                    <option>Teknik Industri</option>
                                </select>
                            </td>
                        </tr>
                    </table>

                    <h2>Pemilihan Kompetisi</h2>
                    <table>
                        <tr class="hlRow">
                            <td style="width:32%;">
                                <strong>Bidang Lomba</strong>
                            </td>
                            <td>
                                <input type="radio" id="individu" name="tiket" value="individu" />
                                <label for="individu">Perorangan</label>

                                <input type="radio" id="kelompok" name="tiket" value="Kelompok" />
                                <label for="kelompok">Beregu</label>
                            </td>
                        </tr>
                        <tr class="regrow">
                            <td style="vertical-align: top;">
                                <strong>Pilihan Cabang Lomba</strong>
                            </td>
                            <td>
                                <p>
                                    <input type="checkbox" id="prog" name="bidang" value="Programming" />
                                    <label for="prog">Kompetisi Pemrograman</label>
                                </p>
                                <p>
                                    <input type="checkbox" id="ui" name="bidang" value="UI/UX Design" />
                                    <label for="ui">Perancangan UI/UX</label>
                                </p>
                                <p>
                                    <input type="checkbox" id="tulis" name="bidang" value="Karya Tulis" />
                                    <label for="tulis">Lomba Karya Tulis</label>
                                </p>
                            </td>
                        </tr>
                    </table>

                    <h2>Deskripsi Karya</h2>
                    <table>
                        <tr class="hlRow">
                            <td style="vertical-align: top;">
                                <label for="deskripsi">
                                    <strong>Ringkasan Deskripsi Karya</strong>
                                </label>
                            </td>
                            <td>
                                <textarea id="deskripsi" name="deskripsi" rows="8" cols="30"></textarea>
                            </td>
                        </tr>
                        <tr class="regrow">
                            <td>
                                <label for="bukti"><strong>Unggah Berkas Proyek</strong></label>
                            </td>
                            <td>
                                <input type="file" id="bukti" name="bukti" accept="image/gif, image/jpeg, image/png" />
                            </td>
                        </tr>
                        <tr class="hlRow">
                            <td colspan="2" style="text-align: center;">
                                <input type="submit" name="Daftar" value="Kirim" />
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
